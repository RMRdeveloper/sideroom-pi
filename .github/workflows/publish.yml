name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated vSemVer tag to publish (for example, v6.0.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 22.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be an exact vSemVer tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "tag must be annotated" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$TAG^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "tag must resolve to the current main commit" >&2
            exit 1
          fi
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "v$package_version" != "$TAG" ]]; then
            echo "tag and package version do not match" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance --access public
