name: Browser download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Sideroom release tag, for example v8.13.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: browser-download-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify existing release and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            printf 'The release tag does not match package.json.\n' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - run: npm run package:browser
      - name: Attach browser companion and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/browser/sideroom-browser-extension.zip dist/browser/sideroom-browser-extension.zip.sha256 --clobber
